[project]
name = "roofphoto"
version = "0.1.0"
description = "Roof measurement from aerial photos, trained on labels from a LiDAR roof pipeline"
readme = "README.md"
authors = [
    { name = "Oluwatifunmilayo Ude", email = "funmichimdi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "roofrecon",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# zip() over arrays of matching length by construction; strict= would only add noise.
ignore = ["B905"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
roofrecon = { path = "../3D reconstruction ", editable = true }
